<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="神獸令：東方神獸主題的預測吃墩紙牌遊戲，單機對電腦。">
<title>神獸令</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen lacquer card table, phone-first column (opponents → trick → your hand → actions) */
:root{
  --ink:#0b1020;
  --table:#16213a;
  --table-hi:#22325a;
  --paper:#f3ede0;
  --paper-edge:#d6c9ad;
  --text:#ece5d3;
  --muted:#9aa4bd;
  --line:rgba(236,229,211,.12);
  --panel:rgba(236,229,211,.045);
  --gold:#d9a83a;
  --gold-hi:#f2d68e;
  --cinnabar:#c63f2b;
  --good:#5fbf8f;
  --bad:#e0664f;
  --qing:#14897a;
  --zhu:#c93a22;
  --bai:#5f7088;
  --xuan:#262b4a;
  --font-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --font-ui:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{
  height:100%;margin:0;overflow:hidden;color:var(--text);font-family:var(--font-ui);
  background:
    radial-gradient(60% 40% at 18% 30%, rgba(217,168,58,.06), transparent 70%),
    radial-gradient(50% 35% at 85% 70%, rgba(20,137,122,.07), transparent 70%),
    radial-gradient(120% 75% at 50% 45%, var(--table-hi) 0%, var(--table) 50%, var(--ink) 100%);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

#app{
  height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:8px 10px;
}

/* top bar */
.top{display:flex;align-items:center;gap:8px;min-height:40px}
.rd{font-family:var(--font-display);font-size:17px;white-space:nowrap}
.rd b{font-size:22px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:13px;white-space:nowrap;margin-inline:auto}
.chip .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);
  font-size:15px;font-weight:700;background:var(--paper);color:var(--sc,#666)}
.chip .lbl{color:var(--muted);font-size:12px;letter-spacing:.08em}
.chip.flash{animation:flash .9s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 3px var(--gold),0 0 22px rgba(217,168,58,.6)}}
.topnav{display:flex;gap:4px}
.topnav button{background:none;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;min-height:36px}

/* suit colours */
.s-L{--sc:var(--qing)} .s-Q{--sc:var(--zhu)} .s-H{--sc:var(--bai)} .s-W{--sc:var(--xuan)}

/* opponents */
.opps{display:grid;grid-template-columns:repeat(var(--oc,3),minmax(0,1fr));gap:6px}
.opp{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 4px 6px;text-align:center;min-width:0;transition:border-color .2s, box-shadow .2s}
.opp.turn{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 0 18px rgba(217,168,58,.25)}
.opp .nm{font-family:var(--font-display);font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.opp .st b{color:var(--text);font-weight:500}
.opp .sc{font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px}
.opp .cnt{position:absolute;top:5px;right:5px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.opp .lead{position:absolute;top:4px;left:5px;font-size:10px;color:var(--gold-hi);font-family:var(--font-display)}
.need{display:inline-block;font-size:11px;padding:1px 6px;border-radius:999px;margin-top:3px;white-space:nowrap}
.need.go{background:rgba(217,168,58,.16);color:var(--gold-hi)}
.need.ok{background:rgba(95,191,143,.16);color:var(--good)}
.need.over{background:rgba(224,102,79,.16);color:var(--bad)}

/* table */
.table{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  border-radius:18px;border:1px solid var(--line);
  background:radial-gradient(90% 80% at 50% 50%, rgba(255,255,255,.035), transparent 70%);transition:background .4s}
.table.chaos{background:radial-gradient(90% 80% at 50% 50%, rgba(154,166,196,.16), transparent 75%)}
.trick-meta{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:12px;color:var(--muted);min-height:22px;padding-inline:8px}
.tag{padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tag.warn{border-color:rgba(197,139,224,.5);color:#dcb6ee}
.tag.chaos{border-color:rgba(154,166,196,.6);color:#c9d1e6}
.slots{display:grid;grid-template-columns:repeat(var(--cols,4),auto);gap:12px 10px;justify-content:center}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.slot .who{font-size:12px;color:var(--muted);white-space:nowrap;font-family:var(--font-display)}
.slot .ph{width:var(--sw);height:calc(var(--sw)*1.42);border-radius:8px;border:1.5px dashed var(--line)}
.slot.turn .ph{border-color:var(--gold);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(217,168,58,.45)}}
.slot.win .card{box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(217,168,58,.55)}
.slot.win .who{color:var(--gold-hi)}
.slot .xf{font-size:11px;padding:1px 6px;border-radius:6px;background:rgba(241,217,160,.14);color:#f1d9a0;white-space:nowrap}
.slot.devoured .card{filter:grayscale(.85) brightness(.55);transform:scale(.88) rotate(-7deg)}
.slot.devoured .xf{background:rgba(197,139,224,.2);color:#dcb6ee}
.msg{font-size:13px;line-height:1.5;color:var(--text);text-align:center;min-height:40px;padding-inline:12px;max-width:42ch;text-wrap:balance}
.banner{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(11,16,32,.9);border:1px solid var(--gold);
  color:var(--gold-hi);font-family:var(--font-display);font-size:17px;padding:8px 16px;border-radius:999px;white-space:nowrap;animation:rise .35s ease}
@keyframes rise{from{transform:translate(-50%,8px);opacity:.3}}

/* me */
.me{display:flex;flex-direction:column;gap:6px}
.me-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.me-row .nm{font-family:var(--font-display);font-size:18px;color:var(--text)}
.me-row b{color:var(--text);font-weight:500}
.me-row.turn .nm{color:var(--gold-hi)}
.detail{min-height:38px;font-size:12.5px;line-height:1.45;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.detail strong{color:var(--text);font-family:var(--font-display);font-size:15px;font-weight:700;margin-right:6px}
.detail .err{color:var(--bad)}

/* hand */
.hand{position:relative;height:calc(var(--hw,64px)*1.42 + 18px);flex:none}
.hand .card{position:absolute;bottom:0;transition:transform .18s ease, left .25s ease, filter .2s}
.hand .card.sel{transform:translateY(-16px);box-shadow:0 0 0 2px var(--gold-hi),0 10px 20px rgba(0,0,0,.5)}
.hand .card.dim{filter:brightness(.45) saturate(.5)}
.hand .card:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

/* actions */
.actions{min-height:56px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.status{font-size:13px;color:var(--muted);text-align:center}
.bidbox .q{font-family:var(--font-display);font-size:16px;text-align:center}
.bidgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.bidgrid button{flex:0 0 calc((100% - 30px) / 6);min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:18px;font-variant-numeric:tabular-nums;font-family:var(--font-display)}
.bidgrid button:active{background:rgba(217,168,58,.2)}
.btn{min-height:48px;border-radius:12px;border:0;background:var(--gold);color:#1d1606;font-weight:700;font-size:16px;padding:0 20px;width:100%}
.btn:disabled{background:rgba(217,168,58,.25);color:rgba(29,22,6,.6);cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.row{display:flex;gap:8px}

/* cards */
.card{--w:64px;width:var(--w);height:calc(var(--w)*1.42);border-radius:calc(var(--w)*.12);position:relative;flex:none;overflow:hidden;
  background:linear-gradient(170deg,#fbf6ea 0%,var(--paper) 60%,#e8dfca 100%);color:var(--sc);
  box-shadow:inset 0 0 0 1px var(--paper-edge),0 6px 14px rgba(0,0,0,.38);font-family:var(--font-display)}
.card.num::after{content:"";position:absolute;inset:calc(var(--w)*.05);border:1px solid color-mix(in srgb, var(--sc) 30%, transparent);border-radius:calc(var(--w)*.08);pointer-events:none}
.card .rk{position:absolute;top:calc(var(--w)*.06);left:calc(var(--w)*.1);font-size:calc(var(--w)*.3);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;font-family:var(--font-ui)}
.card .rk.b{top:auto;left:auto;bottom:calc(var(--w)*.06);right:calc(var(--w)*.1);transform:rotate(180deg)}
.card .gl{position:absolute;left:0;right:0;top:50%;transform:translateY(-44%);text-align:center;font-size:calc(var(--w)*.56);font-weight:700;line-height:1;opacity:.92}
.card .nmv{position:absolute;bottom:calc(var(--w)*.09);left:calc(var(--w)*.11);font-size:calc(var(--w)*.15);opacity:.7}
.card.trump{box-shadow:inset 0 0 0 1px var(--paper-edge),inset 0 0 0 calc(var(--w)*.03) color-mix(in srgb, var(--gold) 70%, transparent),0 6px 14px rgba(0,0,0,.38)}
.card.sp{background:linear-gradient(165deg,#2a2638 0%,#17141f 100%);color:var(--spc);box-shadow:inset 0 0 0 1px rgba(217,168,58,.55),0 6px 14px rgba(0,0,0,.45)}
.card.sp::before{content:"";position:absolute;inset:calc(var(--w)*.05);border:1px solid rgba(217,168,58,.28);border-radius:calc(var(--w)*.08)}
.card.sp .vn{position:absolute;top:calc(var(--w)*.12);left:50%;transform:translateX(-50%);writing-mode:vertical-rl;font-size:calc(var(--w)*.32);font-weight:700;line-height:1;letter-spacing:.04em}
.card.sp .vn.l3{font-size:calc(var(--w)*.26)}
.card.sp .seal{position:absolute;bottom:calc(var(--w)*.1);left:50%;transform:translateX(-50%);background:var(--cinnabar);color:#fbeee0;
  font-size:calc(var(--w)*.15);line-height:1;padding:calc(var(--w)*.04) calc(var(--w)*.05);border-radius:2px;white-space:nowrap;font-weight:700}
.sp-dragon{--spc:#e9b949}.sp-qilin{--spc:#78c6a3}.sp-phoenix{--spc:#ef7b4f}.sp-fox{--spc:#f1d9a0}
.sp-taotie{--spc:#c58be0}.sp-hundun{--spc:#9aa6c4}.sp-hetu{--spc:#76b8e6}.sp-rabbit{--spc:#e4e7f2}
.card.back{background:
  repeating-linear-gradient(45deg, rgba(217,168,58,.22) 0 2px, transparent 2px 9px),
  repeating-linear-gradient(-45deg, rgba(217,168,58,.22) 0 2px, transparent 2px 9px),
  linear-gradient(160deg,#7a2418,#4a160f);box-shadow:inset 0 0 0 2px rgba(217,168,58,.6),0 4px 10px rgba(0,0,0,.4)}
.card.enter{animation:enter .32s cubic-bezier(.2,.8,.3,1)}
@keyframes enter{from{transform:translateY(var(--fy,30px)) scale(.82);opacity:.2}}

/* overlay sheets */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,8,16,.74);display:flex;align-items:flex-end;justify-content:center;
  padding-top:max(24px, env(safe-area-inset-top, 0px))}
.sheet{width:100%;max-width:560px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;-webkit-user-select:text;user-select:text;
  background:linear-gradient(180deg,#1b2643,#121a2f);border-top:1px solid var(--gold);border-radius:18px 18px 0 0;
  padding-top:18px;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));
  padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));animation:sheet .28s ease}
@keyframes sheet{from{transform:translateY(24px);opacity:.4}}
.sheet h2{font-family:var(--font-display);font-size:24px;margin:0 0 4px;text-wrap:balance;color:var(--gold-hi)}
.sheet h3{font-family:var(--font-display);font-size:18px;margin:22px 0 8px;color:var(--text)}
.sheet p,.sheet li{font-size:14px;line-height:1.7;color:#d6d0c0;max-width:65ch}
.sheet ul,.sheet ol{padding-left:1.3em;margin:6px 0}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.sheet .close{position:sticky;top:0;float:right;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.suitpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.suitpick button{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:left;min-height:64px}
.suitpick .dot{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--paper);color:var(--sc);font-family:var(--font-display);font-size:24px;font-weight:700;flex:none}
.suitpick small{display:block;color:var(--muted);font-size:12px}
.scroll-x{overflow-x:auto;margin:8px 0}
table.score{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.score th,table.score td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.score th{color:var(--muted);font-weight:500;font-size:12px}
table.score td:first-child,table.score th:first-child{text-align:left;font-family:var(--font-display);font-size:15px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:8px}
.gitem{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.gitem p{margin:0;font-size:13px;line-height:1.6}
.gitem b{font-family:var(--font-display);font-size:16px;color:var(--text)}
.order{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.order span.o{padding:3px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.menu-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.rd,.opp .nm,.slot .who,.banner,.me-row .nm,.bidbox .q,.sheet h2,.sheet h3,.ctitle,.gitem b,table.score td:first-child,.opp .lead{font-weight:600;letter-spacing:.02em}
.sheet h2{letter-spacing:.06em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);min-width:52px}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:rgba(217,168,58,.18);color:var(--gold-hi)}
.loglist{font-size:13px;line-height:1.6;color:#d6d0c0;margin:0;padding-left:1.2em}
.rank1{color:var(--gold-hi)}

/* tutorial coach */
.table.tut{justify-content:flex-start;padding-top:10px}
.table.tut .slots{margin-block:auto}
.table.tut .msg{display:none}
.coach{align-self:stretch;margin-inline:10px;background:linear-gradient(180deg,rgba(27,38,67,.97),rgba(18,26,47,.97));
  border:1px solid rgba(217,168,58,.55);border-radius:14px;padding:10px 12px 12px;box-shadow:0 10px 26px rgba(0,0,0,.35);animation:sheet .25s ease}
.coach-top{display:flex;align-items:center;gap:8px}
.ctag{font-size:11px;letter-spacing:.08em;color:var(--gold-hi);background:rgba(217,168,58,.14);padding:2px 8px;border-radius:999px;white-space:nowrap}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:6px;height:6px;border-radius:50%;background:rgba(236,229,211,.18)}
.dots i.on{background:var(--gold)}
.cskip{background:none;border:0;color:var(--muted);font-size:12px;padding:4px 2px 4px 6px;min-height:28px}
.ctitle{font-family:var(--font-display);font-size:19px;color:var(--text);margin-top:6px;text-wrap:balance}
.ctext{font-size:14px;line-height:1.6;color:#d9d3c3;margin-top:3px}
.ctext b{color:var(--gold-hi);font-weight:500}
.cerr{font-size:13px;color:var(--bad);margin-top:6px}
.cerr:empty{display:none}
.coach.shake{animation:shake .35s ease}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cbtns{display:flex;gap:8px;margin-top:10px}
.cbtns .btn{min-height:42px;font-size:15px}
.cmini{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px}
.cmini span{padding:3px 8px;border-radius:6px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.cmini span.g{border-color:rgba(95,191,143,.5);color:var(--good)}
.cmini span.r{border-color:rgba(224,102,79,.5);color:var(--bad)}
.tut-focus{outline:2px solid var(--gold-hi);outline-offset:3px;animation:focusPulse 1.1s ease-in-out infinite}
@keyframes focusPulse{50%{outline-color:rgba(242,214,142,.25)}}
.tut-arrow{position:fixed;z-index:40;width:0;height:0;pointer-events:none;border-left:11px solid transparent;border-right:11px solid transparent;
  border-top:14px solid var(--gold-hi);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));animation:bob .9s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.suitpick button:disabled{opacity:.35;cursor:default}

@media (max-height:740px){
  .opp .sc{display:none}
  .detail{min-height:32px;padding:4px 10px}
  .msg{min-height:32px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="rd">第 <b id="rd">1</b> / 10 局</div>
    <div id="trumpChip" class="chip"></div>
    <nav class="topnav">
      <button type="button" data-act="scores">戰績</button>
      <button type="button" data-act="rules">規則</button>
      <button type="button" data-act="menu" aria-label="選單">選單</button>
    </nav>
  </header>
  <section id="opps" class="opps" aria-label="對手"></section>
  <section id="table" class="table" aria-label="牌桌">
    <div id="coach" class="coach" hidden aria-live="polite"></div>
    <div id="trickMeta" class="trick-meta"></div>
    <div id="slots" class="slots"></div>
    <div id="msg" class="msg" aria-live="polite"></div>
  </section>
  <section class="me">
    <div id="meRow" class="me-row"></div>
    <div id="detail" class="detail"></div>
  </section>
  <section id="hand" class="hand" aria-label="你的手牌"></section>
  <section id="actions" class="actions"></section>
</div>
<div id="tutArrow" class="tut-arrow" hidden></div>
<div id="overlay" class="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ---------- data ---------- */
const SUIT_IDS = ['L','Q','H','W'];
const SUITS = {
  L:{name:'青龍', g:'龍', el:'木', dir:'東'},
  Q:{name:'朱雀', g:'雀', el:'火', dir:'南'},
  H:{name:'白虎', g:'虎', el:'金', dir:'西'},
  W:{name:'玄武', g:'龜', el:'水', dir:'北'},
};
const SP_ORDER = ['dragon','qilin','phoenix','fox','taotie','hundun','hetu','rabbit'];
const SP = {
  dragon:{name:'黃龍', title:'至尊', count:1, rule:'必勝。沒有任何牌能勝過黃龍，饕餮也吞不下它。'},
  qilin:{name:'麒麟', title:'祥瑞', count:2, rule:'勝過鳳凰與所有數字牌，只輸給黃龍。同一墩有兩張麒麟時，先出的勝。'},
  phoenix:{name:'鳳凰', title:'雙鳴', count:1, rule:'勝過所有數字牌，輸給麒麟與黃龍。誰吃下有鳳凰的墩，誰就算贏兩墩。'},
  fox:{name:'九尾狐', title:'幻化', count:1, rule:'打出瞬間化身：變成桌上最強數字牌的同花色、點數＋1（逆亂墩改為－1）。桌上最強的是神獸，就化為玉兔；桌上沒有可比的牌，自選花色當 7。'},
  taotie:{name:'饕餮', title:'吞噬', count:1, rule:'本身必輸。結算時吞掉本來會贏的那張牌（黃龍除外），剩下的牌重新比。若剩下沒人能贏，饕餮自己吃墩。'},
  hundun:{name:'混沌', title:'逆亂', count:1, rule:'本身必輸。這一墩天命失效，改成引牌花色點數最小的勝。神獸牌不受影響。'},
  hetu:{name:'河圖', title:'改命', count:1, rule:'本身必輸。打出時自選一個花色，立刻成為本局的天命花色，這一墩也算。'},
  rabbit:{name:'玉兔', title:'隱月', count:3, rule:'必輸，任何時候都能出。整墩沒有能比大小的牌時，最先出的玉兔吃墩。'},
};
const ESCAPES = new Set(['rabbit','taotie','hundun','hetu']);
const AI_NAMES = ['崑崙','蓬萊','青丘','瀛洲','方丈'];
const ROUNDS = 10;

let settings = {opp:3, speed:1.4};
try { const s = JSON.parse(localStorage.getItem('shenshouling-settings') || 'null'); if (s && typeof s === 'object') settings = Object.assign(settings, s); } catch (e) {}
if (![2,1.4,0.75].includes(settings.speed)) settings.speed = settings.speed < 1 ? 0.75 : 1.4;
function saveSettings(){ try { localStorage.setItem('shenshouling-settings', JSON.stringify(settings)); } catch (e) {} }

/* ---------- helpers ---------- */
let uid = 0;
function buildDeck(){
  const d = [];
  for (const s of SUIT_IDS) for (let v = 1; v <= 13; v++) d.push({id:++uid, kind:'num', suit:s, val:v});
  for (const k of SP_ORDER) for (let i = 0; i < SP[k].count; i++) d.push({id:++uid, kind:k});
  return d;
}
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function cardName(c){ return c.kind === 'num' ? `${SUITS[c.suit].name} ${c.val}` : SP[c.kind].name; }
function effName(e){ return e.t === 'num' ? `${SUITS[e.suit].name} ${e.val}` : e.t === 'lose' ? '玉兔' : SP[e.t].name; }
function sortHand(h){
  const so = {L:0,Q:1,H:2,W:3};
  const spo = Object.fromEntries(SP_ORDER.map((k,i) => [k,i]));
  h.sort((a,b) => {
    if (a.kind !== 'num' && b.kind !== 'num') return spo[a.kind] - spo[b.kind];
    if (a.kind !== 'num') return -1;
    if (b.kind !== 'num') return 1;
    return so[a.suit] - so[b.suit] || a.val - b.val;
  });
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

/* ---------- rules engine ---------- */
function baseEff(c){
  if (c.kind === 'num') return {t:'num', suit:c.suit, val:c.val};
  if (c.kind === 'dragon' || c.kind === 'qilin' || c.kind === 'phoenix') return {t:c.kind};
  return {t:'lose'};
}
const chaosIn = entries => entries.some(e => e.card.kind === 'hundun');
function leadSuitOf(entries){ const e = entries.find(x => x.eff.t === 'num'); return e ? e.eff.suit : null; }

// index of strongest card ignoring taotie, or -1 when nothing can win
function baseWinner(entries, trump, lead, chaos, skip){
  let best = -1, bk = null;
  entries.forEach((e, i) => {
    if (i === skip) return;
    const f = e.eff; let k = null;
    if (f.t === 'dragon') k = [5, 0];
    else if (f.t === 'qilin') k = [4, 0];
    else if (f.t === 'phoenix') k = [3, 0];
    else if (f.t === 'num') {
      if (chaos) { if (f.suit === lead) k = [1, -f.val]; }
      else if (trump && f.suit === trump) k = [2, f.val];
      else if (f.suit === lead) k = [1, f.val];
    }
    if (k && (bk === null || k[0] > bk[0] || (k[0] === bk[0] && k[1] > bk[1]))) { best = i; bk = k; }
  });
  return best;
}
function resolve(entries, trump){
  const chaos = chaosIn(entries);
  const tr = chaos ? null : trump;
  const lead = leadSuitOf(entries);
  const w = baseWinner(entries, tr, lead, chaos, -1);
  const tao = entries.findIndex(e => e.card.kind === 'taotie');
  if (w < 0) {
    const r = entries.findIndex(e => e.card.kind === 'rabbit');
    return {winner: r >= 0 ? r : 0, devoured:-1, how: r >= 0 ? 'rabbit' : 'first', chaos};
  }
  if (tao >= 0 && entries[w].eff.t !== 'dragon') {
    const w2 = baseWinner(entries, tr, lead, chaos, w);
    if (w2 < 0) return {winner:tao, devoured:w, how:'taotie', chaos};
    return {winner:w2, devoured:w, how:'normal', chaos};
  }
  return {winner:w, devoured:-1, how:'normal', chaos};
}
function foxEff(entries, trump, choice){
  const chaos = chaosIn(entries);
  const w = baseWinner(entries, chaos ? null : trump, leadSuitOf(entries), chaos, -1);
  if (w < 0) return {t:'num', suit:choice || 'L', val:7, fox:'free'};
  const f = entries[w].eff;
  if (f.t !== 'num') return {t:'lose', fox:'rabbit'};
  return {t:'num', suit:f.suit, val: chaos ? Math.max(0, f.val - 1) : Math.min(14, f.val + 1), fox:'copy'};
}
function foxIsFree(entries, trump){
  const chaos = chaosIn(entries);
  return baseWinner(entries, chaos ? null : trump, leadSuitOf(entries), chaos, -1) < 0;
}
function legalCards(hand, entries){
  const lead = leadSuitOf(entries);
  if (!lead || !hand.some(c => c.kind === 'num' && c.suit === lead)) return hand.slice();
  return hand.filter(c => c.kind !== 'num' || c.suit === lead);
}

/* ---------- game state ---------- */
let G = null;
let selectedId = null;
let humanResolve = null;
let tapResolve = null;
let lastEnterId = null;

function newGame(){
  const n = settings.opp + 1;
  const names = shuffle(AI_NAMES.slice()).slice(0, settings.opp);
  G = {
    n, round:0, token:{}, phase:'idle',
    players:[{name:'你', human:true}, ...names.map(nm => ({name:nm, human:false}))],
    startSeat: Math.floor(Math.random() * n),
    trump:null, trumpCard:null, trumpNote:'', leader:0, trick:[], turn:-1, tricksDone:0,
    result:null, msg:'', log:[],
  };
  G.players.forEach(p => Object.assign(p, {hand:[], bid:null, pendingBid:null, won:0, captured:[], score:0, hist:[]}));
  selectedId = null; humanResolve = null; tapResolve = null;
  closeSheet();
  resetTutUI();
  startRound();
}
function log(s){ G.log.push(`第${G.round}局｜${s}`); if (G.log.length > 300) G.log.shift(); }

function startRound(){
  G.round++;
  const r = G.round;
  const deck = shuffle(buildDeck());
  G.players.forEach(p => { p.hand = deck.splice(0, r); sortHand(p.hand); p.bid = null; p.won = 0; p.captured = []; });
  G.trumpCard = deck.shift();
  G.trump = G.trumpCard.kind === 'num' ? G.trumpCard.suit : null;
  G.trumpNote = G.trump ? `翻出 ${cardName(G.trumpCard)}` : `翻出${SP[G.trumpCard.kind].name}，本局無天命`;
  if (r > 1) G.startSeat = (G.startSeat + 1) % G.n;
  G.leader = G.startSeat; G.trick = []; G.turn = -1; G.tricksDone = 0; G.result = null;
  G.phase = 'bid';
  G.players.forEach(p => { if (!p.human) p.pendingBid = aiBid(p); });
  G.msg = `每人 ${r} 張牌。天命${G.trumpNote}。看完手牌，預測你會吃幾墩。`;
  log(`發牌，天命${G.trumpNote}`);
  selectedId = null;
  render();
  flashChip();
}
function humanBid(b){
  if (G.phase !== 'bid') return;
  if (G.tut) {
    if (b !== G.tut.wantBid) { coachError(`這一步請下注 ${G.tut.wantBid}（有箭頭的按鈕）。`); return; }
    G.players[0].bid = b;
    const r = G.tut.bidResolve; G.tut.bidResolve = null; G.tut.focus = null;
    r && r();
    return;
  }
  G.players[0].bid = b;
  G.players.forEach(p => { if (!p.human) p.bid = p.pendingBid; });
  G.phase = 'play';
  const bids = G.players.map(p => `${p.name} ${p.bid}`).join('、');
  G.msg = `下注公開：${bids}。由 ${G.players[G.leader].name} 先出。`;
  log(`下注：${bids}`);
  render();
  playLoop(G.token);
}

const sleep = ms => new Promise(res => setTimeout(res, ms * settings.speed));
function waitTap(ms){
  return new Promise(res => {
    let done = false;
    const fin = () => { if (!done) { done = true; tapResolve = null; res(); } };
    tapResolve = fin;
    setTimeout(fin, ms * settings.speed);
  });
}

async function playLoop(tok){
  while (G.token === tok && G.tricksDone < G.round) {
    G.trick = []; G.result = null; G.phase = 'play';
    for (let i = 0; i < G.n; i++) {
      const seat = (G.leader + i) % G.n;
      G.turn = seat; render();
      if (G.players[seat].human) {
        await new Promise(res => { humanResolve = res; });
      } else {
        await sleep(i === 0 ? 650 : 750);
        if (G.token !== tok) return;
        const o = aiChoose(seat);
        doPlay(seat, o.card, o.choice);
      }
      if (G.token !== tok) return;
      render();
    }
    G.turn = -1;
    await sleep(350);
    if (G.token !== tok) return;
    finishTrick();
    render();
    await waitTap(2100);
    if (G.token !== tok) return;
  }
  if (G.token !== tok) return;
  scoreRound();
}

function doPlay(seat, card, choice){
  const p = G.players[seat];
  p.hand = p.hand.filter(c => c.id !== card.id);
  let eff;
  if (card.kind === 'fox') eff = foxEff(G.trick, G.trump, choice);
  else eff = baseEff(card);
  let text = `${p.name} 打出 ${cardName(card)}`;
  if (card.kind === 'hetu') {
    G.trump = choice;
    G.trumpNote = `${p.name}以河圖改命`;
    text += `，天命改為 ${SUITS[choice].name}`;
    flashChip();
  } else if (card.kind === 'fox') {
    text += eff.t === 'lose' ? '，桌上神獸太強，化為玉兔' : `，化為 ${SUITS[eff.suit].name} ${eff.val}`;
  } else if (card.kind === 'taotie') text += '，結算時將吞掉最強的牌';
  else if (card.kind === 'hundun') text += '，本墩逆亂：比小、天命失效';
  else if (card.kind === 'phoenix') text += '，吃下這墩算兩墩';
  G.trick.push({seat, card, eff, choice});
  lastEnterId = card.id;
  G.msg = text + '。';
  log(text);
}

function finishTrick(){
  const res = resolve(G.trick, G.trump);
  const ent = G.trick[res.winner];
  const w = ent.seat;
  const phoenix = G.trick.some(e => e.card.kind === 'phoenix');
  G.players[w].won += phoenix ? 2 : 1;
  G.players[w].captured.push({entries:G.trick.slice(), trump: res.chaos ? null : G.trump});
  G.result = Object.assign({seat:w, phoenix}, res);
  let t = `${G.players[w].name} 吃下此墩`;
  const notes = [];
  if (res.devoured >= 0) notes.push(`饕餮吞掉了 ${G.players[G.trick[res.devoured].seat].name} 的${effName(G.trick[res.devoured].eff)}`);
  if (res.how === 'taotie') notes.push('沒有其他牌能贏，饕餮自己吃墩');
  if (res.how === 'rabbit') notes.push('整墩無可比之牌，最先出的玉兔吃墩');
  if (res.how === 'first') notes.push('整墩無可比之牌，由引牌者吃墩');
  if (phoenix) notes.push('有鳳凰，計兩墩');
  G.msg = t + (notes.length ? `。${notes.join('；')}。` : '。');
  log(G.msg);
  G.phase = 'trickEnd';
  G.leader = w;
  G.tricksDone++;
}

function bonusFor(seatIdx, p){
  let bonus = 0; const notes = [];
  for (const cap of p.captured) for (const e of cap.entries) {
    if (e.seat === seatIdx) continue;
    const c = e.card;
    if (c.kind === 'num' && c.val === 13) {
      const t = cap.trump && c.suit === cap.trump;
      bonus += t ? 20 : 10; notes.push(`${cardName(c)}${t ? '（天命）' : ''} +${t ? 20 : 10}`);
    } else if (c.kind === 'qilin') { bonus += 20; notes.push('麒麟 +20'); }
    else if (c.kind === 'phoenix') { bonus += 20; notes.push('鳳凰 +20'); }
    else if (c.kind === 'fox') { bonus += 10; notes.push('九尾狐 +10'); }
  }
  return {bonus, notes};
}
function scoreRound(){
  const r = G.round;
  G.players.forEach((p, i) => {
    let base, hit;
    if (p.bid === 0) { hit = p.won === 0; base = hit ? 10 * r : -10 * r; }
    else { hit = p.won === p.bid; base = hit ? 20 * p.bid : -10 * Math.abs(p.won - p.bid); }
    const b = hit ? bonusFor(i, p) : {bonus:0, notes:[]};
    const total = base + b.bonus;
    p.score += total;
    p.hist.push({bid:p.bid, won:p.won, base, bonus:b.bonus, notes:b.notes, total, hit});
  });
  G.phase = r >= ROUNDS ? 'over' : 'roundEnd';
  G.msg = r >= ROUNDS ? '十局結束。' : `第 ${r} 局結束。`;
  render();
  openRoundSheet();
}

/* ---------- AI ---------- */
function aiBid(p){
  const r = G.round, n = G.n, tr = G.trump;
  let e = 0;
  for (const c of p.hand) {
    switch (c.kind) {
      case 'dragon': e += 1; break;
      case 'qilin': e += 0.85; break;
      case 'phoenix': e += r >= 3 ? 1.3 : 0.4; break;
      case 'fox': e += 0.45; break;
      case 'hetu': e += 0.15; break;
      case 'num': {
        const x = c.val / 13;
        if (tr && c.suit === tr) e += Math.pow(x, 1.6) * 0.95;
        else e += Math.pow(x, 3 + (n - 3) * 0.6) * (tr ? 0.7 : 0.85) * Math.max(0.55, 1 - r * 0.035);
        break;
      }
    }
  }
  const b = Math.round(e + (Math.random() - 0.5) * 0.7);
  return Math.max(0, Math.min(r, b));
}
function strength(c){
  switch (c.kind) {
    case 'dragon': return 100; case 'qilin': return 90; case 'phoenix': return 80; case 'fox': return 45;
    case 'rabbit': return -5; case 'hundun': return -2; case 'taotie': return -1; case 'hetu': return -3;
    default: return (G.trump && c.suit === G.trump ? 30 : 0) + c.val;
  }
}
function suitPref(p, wantWin){
  // suit with most total value in hand (want win) or fewest cards (want lose)
  const sc = {L:0,Q:0,H:0,W:0}, ct = {L:0,Q:0,H:0,W:0};
  p.hand.forEach(c => { if (c.kind === 'num') { sc[c.suit] += c.val; ct[c.suit]++; } });
  const ids = SUIT_IDS.slice();
  ids.sort((a,b) => wantWin ? sc[b] - sc[a] : ct[a] - ct[b] || sc[a] - sc[b]);
  return ids;
}
function simWin(seat, c, ch){
  const entries = G.trick.slice();
  const tr = c.kind === 'hetu' ? ch : G.trump;
  const eff = c.kind === 'fox' ? foxEff(entries, G.trump, ch) : baseEff(c);
  entries.push({seat, card:c, eff});
  return entries[resolve(entries, tr).winner].seat === seat;
}
function aiChoose(seat){
  const p = G.players[seat];
  const legal = legalCards(p.hand, G.trick);
  const need = p.bid - p.won;
  const left = p.hand.length;
  const wantWin = need > 0;
  const after = G.n - G.trick.length - 1;
  const pref = suitPref(p, wantWin);
  const opts = [];
  for (const c of legal) {
    const free = c.kind === 'hetu' || (c.kind === 'fox' && foxIsFree(G.trick, G.trump));
    const chs = free ? pref : [null];
    chs.forEach((ch, idx) => opts.push({card:c, choice:ch, wins:simWin(seat, c, ch), s:strength(c) - idx * 0.01}));
  }
  const byS = (a,b) => a.s - b.s;
  const pick = arr => arr[0];
  const pickMax = arr => arr[arr.length - 1];
  opts.sort(byS);

  if (G.trick.length === 0) {
    if (wantWin) {
      let pool = opts;
      if (need === 1 && pool.some(o => o.card.kind !== 'phoenix')) pool = pool.filter(o => o.card.kind !== 'phoenix');
      // lead hetu/fox: choose their preferred suit (first choice)
      return pickMax(pool.filter(o => o.s === Math.floor(o.s) || o.choice === pref[0]));
    }
    const nums = opts.filter(o => o.card.kind === 'num');
    if (nums.length) return pick(nums);
    const rab = opts.find(o => o.card.kind === 'rabbit');
    return rab || pick(opts);
  }

  if (wantWin) {
    let win = opts.filter(o => o.wins);
    if (need === 1 && win.some(o => o.card.kind !== 'phoenix')) win = win.filter(o => o.card.kind !== 'phoenix');
    if (win.length) {
      if (after === 0) return pick(win);
      if (need >= left) return pickMax(win);
      const thr = G.trump ? 40 : 12;
      return win.find(o => o.s >= thr) || pickMax(win);
    }
    return pick(opts);
  }
  const lose = opts.filter(o => !o.wins);
  if (lose.length) {
    const solid = lose.filter(o => !ESCAPES.has(o.card.kind));
    return solid.length ? pickMax(solid) : pick(lose);
  }
  return pick(opts);
}

/* ---------- rendering ---------- */
function cardHTML(c, opts = {}){
  const w = opts.w || 64;
  const extra = (opts.cls || '') + (c.id === lastEnterId && opts.animate ? ' enter' : '');
  const attrs = opts.attrs || '';
  if (c.kind === 'num') {
    const s = SUITS[c.suit];
    const tr = opts.trump && G && G.trump === c.suit ? ' trump' : '';
    return `<div class="card num s-${c.suit}${tr} ${extra}" style="--w:${w}px" ${attrs}><span class="rk">${c.val}</span><span class="gl">${s.g}</span><span class="rk b">${c.val}</span></div>`;
  }
  const d = SP[c.kind];
  return `<div class="card sp sp-${c.kind} ${extra}" style="--w:${w}px" ${attrs}><span class="vn${d.name.length > 2 ? ' l3' : ''}">${d.name}</span><span class="seal">${d.title}</span></div>`;
}

function flashChip(){
  const el = $('#trumpChip'); if (!el) return;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

function render(){
  if (!G) return;
  $('.rd').innerHTML = G.tut ? '<b>新手</b>教學' : `第 <b id="rd">${G.round}</b> / 10 局`;
  // trump chip
  const chip = $('#trumpChip');
  const chaosNow = G.trick.length && chaosIn(G.trick) && G.phase !== 'bid';
  if (G.trump) {
    chip.className = `chip s-${G.trump}` + (chip.classList.contains('flash') ? ' flash' : '');
    chip.innerHTML = `<span class="dot">${SUITS[G.trump].g}</span><span><span class="lbl">天命</span> ${SUITS[G.trump].name}${chaosNow ? '（失效）' : ''}</span>`;
  } else {
    chip.className = 'chip' + (chip.classList.contains('flash') ? ' flash' : '');
    chip.innerHTML = `<span class="dot" style="color:var(--muted)">無</span><span><span class="lbl">天命</span> 本局無</span>`;
  }
  chip.title = G.trumpNote;

  renderOpps();
  renderTable();
  renderMe();
  renderHand();
  renderActions();
  applyTut();
}
function needChip(p){
  if (p.bid === null) return '';
  const need = p.bid - p.won;
  if (need > 0) return `<span class="need go">還需 ${need}</span>`;
  if (need === 0) return `<span class="need ok">${p.bid === 0 ? '要避開' : '已達標'}</span>`;
  return `<span class="need over">超出 ${-need}</span>`;
}
function renderOpps(){
  const el = $('#opps');
  el.style.setProperty('--oc', G.n - 1);
  el.innerHTML = G.players.slice(1).map((p, k) => {
    const seat = k + 1;
    const bidTxt = G.phase === 'bid' ? '?' : (p.bid === null ? '—' : p.bid);
    return `<div class="opp${G.turn === seat ? ' turn' : ''}">
      ${G.phase !== 'bid' && G.leader === seat && G.trick.length < G.n && G.phase === 'play' ? '<span class="lead">先</span>' : ''}
      <span class="cnt">${p.hand.length}張</span>
      <div class="nm">${esc(p.name)}</div>
      <div class="st">注 <b>${bidTxt}</b> · 得 <b>${p.won}</b></div>
      <div class="sc">${p.score} 分</div>
      ${G.phase === 'bid' ? '' : needChip(p)}
    </div>`;
  }).join('');
}
function renderTable(){
  const tb = $('#table');
  const chaos = chaosIn(G.trick);
  tb.classList.toggle('chaos', !!chaos);
  // meta
  const lead = leadSuitOf(G.trick);
  const tags = [];
  if (G.phase === 'bid') tags.push(`<span class="tag">天命${esc(G.trumpNote)}</span>`);
  else {
    tags.push(`<span class="tag">第 ${Math.min(G.tricksDone + (G.phase === 'trickEnd' ? 0 : 1), G.round)} / ${G.round} 墩</span>`);
    if (lead) tags.push(`<span class="tag s-${lead}">引牌 ${SUITS[lead].name}</span>`);
    if (chaos) tags.push('<span class="tag chaos">逆亂：比小、天命失效</span>');
    if (G.trick.some(e => e.card.kind === 'taotie')) tags.push('<span class="tag warn">饕餮在場</span>');
  }
  $('#trickMeta').innerHTML = tags.join('');

  // slots
  const slotsEl = $('#slots');
  const sw = G.n >= 5 ? 58 : 64;
  slotsEl.style.setProperty('--cols', G.n <= 4 ? G.n : 3);
  slotsEl.style.setProperty('--sw', sw + 'px');
  let live = null;
  if (G.trick.length) live = G.phase === 'trickEnd' && G.result ? G.result : resolve(G.trick, G.trump);
  const html = [];
  for (let i = 0; i < G.n; i++) {
    const seat = (G.leader + i) % G.n;
    const p = G.players[seat];
    const idx = G.trick.findIndex(e => e.seat === seat);
    const e = idx >= 0 ? G.trick[idx] : null;
    let cls = 'slot';
    let note = '';
    if (G.phase === 'bid') { /* empty table */ }
    if (e) {
      if (live && live.winner === idx) cls += ' win';
      if (live && live.devoured === idx) { cls += ' devoured'; note = '<span class="xf">被吞</span>'; }
      else if (e.card.kind === 'fox') note = `<span class="xf">化·${e.eff.t === 'lose' ? '玉兔' : SUITS[e.eff.suit].name + e.eff.val}</span>`;
      else if (e.card.kind === 'hetu') note = `<span class="xf">改命·${SUITS[e.choice].name}</span>`;
    } else if (G.turn === seat) cls += ' turn';
    const fy = seat === 0 ? '40px' : '-40px';
    const label = `${esc(p.name)}${live && e && live.winner === idx ? (G.phase === 'trickEnd' ? ' 吃墩' : ' 領先') : ''}`;
    html.push(`<div class="${cls}" style="--fy:${fy}">
      ${e ? cardHTML(e.card, {w:sw, animate:true, trump:true}) : `<div class="ph"></div>`}
      <span class="who">${label}</span>${note}
    </div>`);
  }
  slotsEl.innerHTML = html.join('');
  $('#msg').textContent = G.msg;
  // banner
  const old = tb.querySelector('.banner'); if (old) old.remove();
  if (G.phase === 'trickEnd' && G.result) {
    const b = document.createElement('div');
    b.className = 'banner';
    b.textContent = `${G.players[G.result.seat].name} 吃墩${G.result.phoenix ? ' ×2' : ''}`;
    tb.appendChild(b);
  }
}

function renderHand(){
  const el = $('#hand');
  const p = G.players[0];
  const W = el.clientWidth || 360;
  const cw = Math.max(54, Math.min(74, Math.floor(W / 6.1)));
  el.style.setProperty('--hw', cw + 'px');
  const n = p.hand.length;
  const step = n > 1 ? Math.min(cw + 6, (W - cw) / (n - 1)) : 0;
  const total = cw + step * (n - 1);
  const start = (W - total) / 2;
  const myTurn = G.phase === 'play' && G.turn === 0;
  const legalIds = myTurn ? new Set(legalCards(p.hand, G.trick).map(c => c.id)) : null;
  el.innerHTML = p.hand.map((c, i) => {
    let cls = '';
    if (c.id === selectedId) cls += ' sel';
    if (legalIds && !legalIds.has(c.id)) cls += ' dim';
    return cardHTML(c, {w:cw, cls, trump:true, attrs:`data-card="${c.id}" role="button" tabindex="0" aria-label="${cardName(c)}"`});
  }).join('');
  el.querySelectorAll('.card').forEach((node, i) => {
    node.style.setProperty('--w', cw + 'px');
    node.style.left = (start + i * step).toFixed(1) + 'px';
    node.style.zIndex = i + 1;
  });
}
function renderActions(){
  const el = $('#actions');

  }
  if (G.phase === 'play' && G.turn === 0) {

  }
  rows += `<tr><td>總分</td>${ps.map(p => `<td><b>${p.score}</b></td>`).join('')}</tr>`;

/* ---------- input ---------- */
function tryPlaySelected(){
  if (!(G.phase === 'play' && G.turn === 0 && humanResolve)) return;
  const p = G.players[0];
  const c = p.hand.find(x => x.id === selectedId);
  if (!c || !legalCards(p.hand, G.trick).some(x => x.id === c.id)) return;
  if (G.tut && G.tut.want && c.id !== G.tut.want) { coachError(`這一步請出 ${G.tut.wantName}（有箭頭的那張）。`); return; }
  if (c.kind === 'hetu' || (c.kind === 'fox' && foxIsFree(G.trick, G.trump))) { openChoice(c); return; }
  commitHuman(c, null);
}
function commitHuman(c, choice){
  const res = humanResolve; humanResolve = null;
  selectedId = null;
  doPlay(0, c, choice);
  res && res();
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-card],[data-bid],[data-act],[data-choose],[data-opp],[data-speed]');
  if (!t) {
    if (G && G.phase === 'trickEnd' && ev.target.closest('#table') && tapResolve) tapResolve();
    return;
  }
  if (t.dataset.card) {
    const id = +t.dataset.card;
    if (selectedId === id && G.phase === 'play' && G.turn === 0) { tryPlaySelected(); return; }
    selectedId = id; render(); return;
  }
  if (t.dataset.bid !== undefined) { humanBid(+t.dataset.bid); return; }
  if (t.dataset.choose) {
    const id = +$('#sheet').dataset.card;
    const c = G.players[0].hand.find(x => x.id === id);
    closeSheet();
    if (c && humanResolve) commitHuman(c, t.dataset.choose);
    return;
  }
  if (t.dataset.opp) { settings.opp = +t.dataset.opp; saveSettings(); openSheet(menuHTML()); return; }
  if (t.dataset.speed) { settings.speed = +t.dataset.speed; saveSettings(); openSheet(menuHTML()); return; }
  switch (t.dataset.act) {
    case 'play': tryPlaySelected(); break;
    case 'continue': if (tapResolve) tapResolve(); break;
    case 'rules': openSheet(rulesHTML()); break;
    case 'scores': openSheet(`<button type="button" class="close" data-act="close">關閉</button><h2>戰績</h2><p class="sub">第 ${G.round} 局進行中</p>${G.players[0].hist.length ? scoreTable() : '<p>第一局還沒結束，打完就會出現每局得分。</p>'}`); break;
    case 'menu': openSheet(menuHTML()); break;
    case 'log': openSheet(`<button type="button" class="close" data-act="close">關閉</button><h2>本場紀錄</h2><ol class="loglist">${G.log.slice().reverse().map(s => `<li>${esc(s)}</li>`).join('')}</ol>`); break;
    case 'close': closeSheet(); break;
    case 'new': G.token = {}; newGame(); break;
    case 'next': closeSheet(); startRound(); break;
    case 'tutorial': closeSheet(); startTutorial(); break;
    case 'tutnext': if (G.tut && G.tut.next) { const r = G.tut.next; G.tut.next = null; r(); } break;
    case 'tutskip': case 'tutplay': markTutDone(); G.token = {}; newGame(); break;
    case 'tutagain': startTutorial(); break;
    case 'roundsheet': openRoundSheet(); break;
  }
});
document.addEventListener('keydown', ev => {

$('#overlay').addEventListener('click', ev => {

  const ar = $('#tutArrow');
  if (!G || !G.tut || !G.tut.focus) { ar.hidden = true; return; }
  const f = G.tut.focus;
  const el = f.card ? document.querySelector(`#hand [data-card="${f.card}"]`) : document.querySelector(f.sel);
  if (!el) { ar.hidden = true; return; }
  el.classList.add('tut-focus');
  if (f.arrow) {
    const r = el.getBoundingClientRect();
    ar.style.left = (r.left + r.width / 2 - 11) + 'px';
    ar.style.top = (r.top - 22) + 'px';
    ar.hidden = false;
  } else ar.hidden = true;
}
function renderCoach(){
  const c = $('#coach');
  const t = G && G.tut;
  if (!t || !t.cur) { c.hidden = true; return; }
  const o = t.cur;
  const dots = Array.from({length:TUT_LESSONS}, (_, i) => `<i class="${i < t.lesson ? 'on' : ''}"></i>`).join('');
  let btns = '';
  if (o.btn) btns = `<div class="cbtns"><button type="button" class="btn" data-act="tutnext">${o.btn}</button></div>`;
  if (o.final) btns = `<div class="cbtns"><button type="button" class="btn" data-act="tutplay">開始正式對局</button><button type="button" class="btn ghost" data-act="tutagain">重玩教學</button></div>`;
  c.innerHTML = `<div class="coach-top"><span class="ctag">${o.tag || '新手教學'}</span><span class="dots" aria-hidden="true">${dots}</span>${o.final ? '' : '<button type="button" class="cskip" data-act="tutskip">跳過教學</button>'}</div>
    ${o.title ? `<div class="ctitle">${o.title}</div>` : ''}<div class="ctext">${o.text}</div><div class="cerr">${t.err ? esc(t.err) : ''}</div>${btns}`;
  c.classList.remove('shake');
  c.hidden = false;
}
function coachError(msg){
  if (!G || !G.tut) return;
  G.tut.err = msg; renderCoach();
  const c = $('#coach'); void c.offsetWidth; c.classList.add('shake');
}
function startTutorial(){
  closeSheet();
  const names = ['崑崙','蓬萊','青丘'];
  G = {
    n:4, round:1, token:{}, phase:'play',
    players:[{name:'你', human:true}, ...names.map(nm => ({name:nm, human:false}))],
    startSeat:0, trump:null, trumpCard:null, trumpNote:'', leader:1, trick:[], turn:-1, tricksDone:0, result:null, msg:'', log:[],
    tut:{lesson:0, cur:null, err:'', focus:null, want:null, wantName:'', wantSuit:null, wantBid:null, next:null, bidResolve:null},
  };
  G.players.forEach(p => Object.assign(p, {hand:[], bid:null, pendingBid:null, won:0, captured:[], score:0, hist:[]}));
  selectedId = null; humanResolve = null; tapResolve = null;
  resetTutUI();
  $('#table').classList.add('tut');
  runTutorial(G.token).catch(e => { if (e !== ABORT) console.error(e); });
}

async function runTutorial(tok){
  const guard = () => { if (!G || G.token !== tok) throw ABORT; };
  const N = (s, v) => ({id:++uid, kind:'num', suit:s, val:v});
  const S = k => ({id:++uid, kind:k});
  const filler = k => Array.from({length:k}, (_, i) => N(SUIT_IDS[i % 4], 2 + i));
  const wait = async ms => { await new Promise(r => setTimeout(r, ms * settings.speed)); guard(); };
  const say = async o => {
    guard();
    G.tut.err = ''; G.tut.cur = o; renderCoach();
    if ('focus' in o) { G.tut.focus = o.focus; applyTut(); }
    if (o.btn) { await new Promise(r => { G.tut.next = r; }); guard(); }
  };
  const setup = ({trump = null, hands, leader, tricks = 1, bids = [null,null,null,null], won = [0,0,0,0], phase = 'play'}) => {
    guard();
    G.trump = trump; G.trumpNote = trump ? `：${SUITS[trump].name}` : '：本局無';
    G.players.forEach((p, i) => { p.hand = hands[i] || []; sortHand(p.hand); p.bid = bids[i]; p.won = won[i]; p.captured = []; });
    G.leader = leader; G.trick = []; G.turn = -1; G.tricksDone = 0; G.round = tricks; G.result = null; G.phase = phase; G.msg = '';
    G.tut.focus = null; selectedId = null; lastEnterId = null;
    render();
    if (trump) flashChip();
  };
  const ai = async (seat, card, choice) => { G.turn = seat; render(); await wait(800); doPlay(seat, card, choice); render(); await wait(250); };
  const you = async (card, choice) => {
    guard();
    G.turn = 0; G.tut.want = card.id; G.tut.wantName = cardName(card); G.tut.wantSuit = choice || null;
    G.tut.focus = {card:card.id, arrow:true};
    render();
    await new Promise(r => { humanResolve = r; }); guard();
    G.tut.want = null; G.tut.wantSuit = null; G.tut.focus = null; G.tut.err = ''; G.turn = -1;
    render(); renderCoach();
    await wait(250);
  };
  const bid = async n => {
    G.tut.wantBid = n; G.tut.focus = {sel:`[data-bid="${n}"]`, arrow:true};
    render();
    await new Promise(r => { G.tut.bidResolve = r; }); guard();
    G.tut.err = ''; G.phase = 'play'; render(); renderCoach();
  };
  const end = async () => { G.turn = -1; await wait(400); finishTrick(); render(); };
  const next = () => { G.trick = []; G.result = null; G.phase = 'play'; render(); };
  const lesson = n => { G.tut.lesson = n; };

  /* 導覽 */
  lesson(0);
  setup({trump:'Q', hands:[[N('Q',12), N('H',13), N('W',3), N('L',5), S('qilin')], filler(5), filler(5), filler(5)], leader:1});
  await say({tag:'導覽', title:'歡迎來到神獸令', text:'每一墩每人出一張牌，最大的人<b>吃下</b>這一墩。每局開始前，你要預測自己會吃幾墩，<b>猜得準</b>才拿分。跟著這 9 個小關卡，邊玩邊學。', btn:'下一步', focus:null});
  await say({tag:'導覽', title:'你的手牌', text:'最下面是你的手牌。<b>點一張牌</b>，下方會顯示它的效果。現在就點點看。', btn:'下一步', focus:{sel:'#hand'}});
  await say({tag:'導覽', title:'對手', text:'上方是三位電腦對手。<b>注</b>是他下注的墩數，<b>得</b>是已經吃到的墩數。', btn:'下一步', focus:{sel:'#opps'}});
  await say({tag:'導覽', title:'天命', text:'這是<b>天命</b>，也就是王牌花色。這裡的天命是朱雀：朱雀的牌勝過其他花色的數字牌。每局開始時翻牌決定。', btn:'開始第一課', focus:{sel:'#trumpChip'}});

  /* 1 跟牌 */
  lesson(1);
  {
    const y = N('Q',12), a = N('Q',8), b = N('Q',10), c = N('L',13);
    setup({hands:[[N('Q',5), y, N('H',13), N('W',3)], [a], [b], [c]], leader:1});
    await say({tag:'第 1 課・跟牌', title:'必須跟出引牌花色', text:'第一張數字牌的花色叫<b>引牌花色</b>。手上有這個花色，就一定要跟出。先看崑崙出牌。', btn:'開始', focus:null});
    await say({tag:'第 1 課・跟牌', title:'看牌中…', text:'對手依序出牌，牌桌上會標出目前誰<b>領先</b>。'});
    await ai(1, a); await ai(2, b); await ai(3, c);
    await say({tag:'第 1 課・跟牌', title:'輪到你', text:'引牌是朱雀。青丘的青龍 13 雖然最大，但<b>不是引牌花色</b>，不能吃墩。你有朱雀，所以其他花色都變暗了。<br><b>點兩下朱雀 12</b>（或點一下再按「出牌」）。'});
    await you(y);
    await end();
    await say({tag:'第 1 課・跟牌', title:'你吃下了這一墩', text:'朱雀 12 是引牌花色裡最大的牌。記住：<b>不同花色的大牌贏不了</b>。', btn:'下一課'});
  }

  /* 2 天命 */
  lesson(2);
  {
    const y = N('W',2), a = N('Q',13), b = N('Q',9), c = N('Q',2);
    setup({trump:'W', hands:[[y, N('H',12), N('L',11)], [a], [b], [c]], leader:1});
    await say({tag:'第 2 課・天命', title:'天命牌再小也能贏', text:'這一局的天命是<b>玄武</b>。天命花色的牌，勝過所有其他花色的數字牌。', btn:'開始', focus:{sel:'#trumpChip'}});
    await say({tag:'第 2 課・天命', title:'看牌中…', text:'崑崙用朱雀 13 引牌。', focus:null});
    await ai(1, a); await ai(2, b); await ai(3, c);
    await say({tag:'第 2 課・天命', title:'輪到你', text:'你沒有朱雀，可以出任何一張。用最小的天命<b>玄武 2</b>，壓過朱雀 13。'});
    await you(y);
    await end();
    await say({tag:'第 2 課・天命', title:'小小的 2 贏了 13', text:'沒有引牌花色的時候，天命牌就是你的武器。', btn:'下一課'});
  }

  /* 3 下注與計分 */
  lesson(3);
  {
    const dragon = S('dragon'), low = N('W',2);
    const a1 = N('L',8), a2 = N('W',10), b1 = N('L',3), b2 = N('H',6), c1 = N('L',12), c2 = N('Q',7);
    setup({hands:[[dragon, low], [a1, a2], [b1, b2], [c1, c2]], leader:1, tricks:2, phase:'bid'});
    await say({tag:'第 3 課・下注', title:'先猜，再打', text:'每局開始時，所有人<b>同時</b>預測自己會吃幾墩。這局每人 2 張牌。', btn:'下一步', focus:null});
    await say({tag:'第 3 課・下注', title:'你要下注幾墩？', text:'<b>黃龍</b>必勝，一定能吃一墩；玄武 2 很小，幾乎贏不了。所以下注 <b>1</b>。'});
    await bid(1);
    G.players[1].bid = 1; G.players[2].bid = 0; G.players[3].bid = 1;
    G.msg = '下注公開：你 1、崑崙 1、蓬萊 0、青丘 1。'; render();
    await say({tag:'第 3 課・下注', title:'下注公開', text:'大家的下注同時公開。上方對手出現「還需」，代表他還要吃幾墩。', btn:'開始出牌', focus:{sel:'#opps'}});
    await say({tag:'第 3 課・下注', title:'看牌中…', text:'崑崙用青龍 8 引牌。', focus:null});
    await ai(1, a1); await ai(2, b1); await ai(3, c1);
    await say({tag:'第 3 課・下注', title:'出黃龍', text:'黃龍是神獸牌，<b>任何時候都能出</b>，不受跟牌限制，而且必勝。'});
    await you(dragon);
    await end();
    await say({tag:'第 3 課・下注', title:'達標了', text:'你吃到 1 墩，正好等於下注。接下來要<b>避免再吃墩</b>。', btn:'下一墩', focus:{sel:'#meRow'}});
    next();
    await say({tag:'第 3 課・下注', title:'你先出', text:'上一墩的贏家先出。你只剩玄武 2，出吧。', focus:null});
    await you(low);
    await ai(1, a2); await ai(2, b2); await ai(3, c2);
    await end();
    G.players[0].score = 20; render();
    await say({tag:'第 3 課・計分', title:'猜中就拿分', text:'你下注 1、吃 1 墩，<b>命中 +20</b>。'
      + '<div class="cmini"><span>注 1・吃 1</span><span class="g">每墩 +20 → +20</span></div>'
      + '<div class="cmini"><span>注 3・吃 1</span><span class="r">差 2 墩 → −20</span></div>'
      + '<div class="cmini"><span>注 0・吃 0</span><span class="g">局數 × 10</span></div>', btn:'下一課'});
  }

  /* 4 麒麟與鳳凰 */
  lesson(4);
  {
    const y = S('qilin'), a = N('H',12), b = S('phoenix'), c = N('H',3);
    setup({trump:'H', hands:[[y, N('H',5)], [a], [b], [c]], leader:1, bids:[2,1,2,0]});
    await say({tag:'第 4 課・神獸', title:'神獸的強弱', text:'神獸牌任何時候都能出。由強到弱：'
      + '<div class="cmini"><span>黃龍</span>›<span>麒麟</span>›<span>鳳凰</span>›<span>天命</span>›<span>引牌花色</span></div>', btn:'開始', focus:null});
    await say({tag:'第 4 課・神獸', title:'看牌中…', text:'崑崙用天命白虎 12 引牌。'});
    await ai(1, a); await ai(2, b); await ai(3, c);
    await say({tag:'第 4 課・神獸', title:'輪到你', text:'鳳凰壓過了天命白虎 12。用<b>麒麟</b>壓過鳳凰。'});
    await you(y);
    await end();
    await say({tag:'第 4 課・神獸', title:'一次吃兩墩', text:'吃下有<b>鳳凰</b>的墩，算<b>兩墩</b>，下注時要算進去。若這局猜中，吃到別人的鳳凰或麒麟還有 <b>+20</b> 獎勵。', btn:'下一課', focus:{sel:'#meRow'}});
  }

  /* 5 九尾狐 */
  lesson(5);
  {
    const y = S('fox'), b = N('H',6), c = N('H',11), a = N('H',9);
    setup({hands:[[y, N('H',4)], [a], [b], [c]], leader:2});
    await say({tag:'第 5 課・九尾狐', title:'幻化', text:'九尾狐會變成<b>桌上最強數字牌</b>的同花色、點數 <b>+1</b>。', btn:'開始', focus:null});
    await say({tag:'第 5 課・九尾狐', title:'看牌中…', text:'蓬萊先出。'});
    await ai(2, b); await ai(3, c);
    await say({tag:'第 5 課・九尾狐', title:'輪到你', text:'桌上最強的是白虎 11。出九尾狐，它會變成<b>白虎 12</b>。'});
    await you(y);
    await ai(1, a);
    await end();
    await say({tag:'第 5 課・九尾狐', title:'化身成功', text:'九尾狐只看<b>打出那一刻</b>的桌面。後面的人若出更大的牌，照樣能贏過它。桌上最強如果是神獸，它就只能化為玉兔。', btn:'下一課'});
  }

  /* 6 混沌 */
  lesson(6);
  {
    const y = S('hundun'), a = N('L',12), b = N('L',3), c = N('L',7);
    setup({trump:'Q', hands:[[y, N('L',13)], [a], [b], [c]], leader:1, bids:[1,0,1,1], won:[1,0,0,0], tricks:2});
    G.tricksDone = 1; render();
    await say({tag:'第 6 課・混沌', title:'不想贏的時候', text:'你下注 1、已經吃到 1 墩，再吃就<b>超出</b>了。可是你手上有青龍 13，跟出一定會贏。', btn:'開始', focus:{sel:'#meRow'}});
    await say({tag:'第 6 課・混沌', title:'看牌中…', text:'崑崙用青龍 12 引牌。', focus:null});
    await ai(1, a); await ai(2, b);
    await say({tag:'第 6 課・混沌', title:'出混沌', text:'混沌讓這一墩<b>比小</b>，天命也失效。牌桌會變色提醒你。'});
    await you(y);
    await ai(3, c);
    await end();
    await say({tag:'第 6 課・混沌', title:'成功躲開', text:'逆亂墩中，引牌花色最小的<b>青龍 3</b> 勝出，蓬萊吃墩。黃龍、麒麟、鳳凰不受混沌影響。', btn:'下一課'});
  }

  /* 7 饕餮 */
  lesson(7);
  {
    const y = N('Q',11), a = N('Q',13), b = N('Q',4), c = S('taotie');
    setup({hands:[[y, N('W',6)], [a], [b], [c]], leader:1, bids:[1,1,0,0]});
    await say({tag:'第 7 課・饕餮', title:'會吃牌的凶獸', text:'這一課你看起來會輸。先出牌，看看會發生什麼事。', btn:'開始', focus:null});
    await ai(1, a); await ai(2, b);
    await say({tag:'第 7 課・饕餮', title:'輪到你', text:'崑崙出了朱雀 13，你的<b>朱雀 11</b> 看起來贏不了，但你必須跟出朱雀。'});
    await you(y);
    await ai(3, c);
    await say({tag:'第 7 課・饕餮', title:'饕餮出現', text:'青丘出了饕餮。結算時，它會<b>吞掉本來會贏的牌</b>，剩下的牌再比一次。牌桌上朱雀 13 已經標成「被吞」。', btn:'結算'});
    await end();
    await say({tag:'第 7 課・饕餮', title:'撿到一墩', text:'朱雀 13 被吞掉，你的朱雀 11 變成最大，吃下這墩。只有<b>黃龍</b>吞不下。有饕餮在場時，第二大的牌反而最好。', btn:'下一課'});
  }

  /* 8 河圖 */
  lesson(8);
  {
    const y = S('hetu'), a = N('H',10), b = N('L',4), c = N('H',8);
    setup({trump:'L', hands:[[y, N('H',5)], [a], [b], [c]], leader:1, bids:[0,0,1,0]});
    await say({tag:'第 8 課・河圖', title:'改變天命', text:'河圖可以把天命換成你指定的花色，<b>這一墩就生效</b>，並持續到本局結束。', btn:'開始', focus:{sel:'#trumpChip'}});
    await say({tag:'第 8 課・河圖', title:'看牌中…', text:'崑崙用白虎 10 引牌。', focus:null});
    await ai(1, a); await ai(2, b);
    await say({tag:'第 8 課・河圖', title:'破壞對手', text:'蓬萊用天命<b>青龍 4</b> 領先，他還需要 1 墩。出河圖，把天命改成<b>白虎</b>，讓他落空。'});
    await you(y, 'H');
    await ai(3, c);
    await end();
    await say({tag:'第 8 課・河圖', title:'改命成功', text:'天命變成白虎後，青龍 4 不是引牌也不是天命，失去威力。白虎 10 最大，崑崙吃墩，蓬萊沒有達標。', btn:'下一課'});
  }

  /* 9 玉兔 */
  lesson(9);
  {
    const y = S('rabbit'), a = N('W',9), b = N('W',4), c = N('W',2);
    setup({hands:[[y, N('W',13)], [a], [b], [c]], leader:1, bids:[0,1,0,1]});
    await say({tag:'第 9 課・玉兔', title:'下注 0 的護身符', text:'你這局下注 <b>0</b>，一墩都不能吃。可是你有玄武 13，跟出一定贏。', btn:'開始', focus:{sel:'#meRow'}});
    await ai(1, a); await ai(2, b);
    await say({tag:'第 9 課・玉兔', title:'出玉兔', text:'<b>玉兔必輸</b>，任何時候都能出。', focus:null});
    await you(y);
    await ai(3, c);
    await end();
    await say({tag:'第 9 課・玉兔', title:'保住零墩', text:'崑崙吃墩，你一墩都沒吃。饕餮、混沌、河圖本身也都必輸，同樣能拿來躲墩。', btn:'完成教學'});
  }

  lesson(10);
  markTutDone();
  setup({hands:[[], [], [], []], leader:0});
  G.msg = '';
  render();
  await say({final:true, tag:'完成', title:'你學會了全部規則', text:'正式對局共 <b>10 局</b>，第 N 局每人 N 張牌，每局翻牌決定天命。忘記規則時，點右上角「規則」或點手牌查看效果。', focus:null});
}

// expose engine for quick self-checks in the console
window.__ssl = {resolve, foxEff, baseEff, legalCards};

if (tutSeen()) newGame(); else startTutorial();
})();
